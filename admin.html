<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel — Use Moda Clara</title>
  <meta name="robots" content="noindex,nofollow">

  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Estilos do Painel -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Cabeçalho e Abas de Navegação -->
  <header>
    <div class="wrap">
      <div class="top">
        <h1>Painel · <span>Use Moda Clara</span></h1>
        <div class="acts">
          <button class="btn g s" id="btnHelp">Como publicar?</button>
        </div>
      </div>
      <div class="tabs" id="tabs">
        <button data-t="produtos" class="on">👙 Produtos</button>
        <button data-t="categorias">🗂️ Categorias</button>
        <button data-t="frete">📦 Frete</button>
        <button data-t="loja">🐚 Loja e textos</button>
      </div>
    </div>
  </header>

  <!-- Área Principal de Conteúdo -->
  <main class="wrap" id="main"></main>

  <!-- Barra Fixa Inferior com Status e Ações -->
  <div class="sticky">
    <div class="wrap">
      <small id="stat">Suas alterações ficam salvas neste navegador como rascunho. Para publicar no site, baixe o arquivo e envie para a hospedagem.</small>
      <div class="acts">
        <button class="btn d s" id="btnReset">Descartar rascunho</button>
        <button class="btn p" id="btnDown">⬇ Baixar dados.js</button>
      </div>
    </div>
  </div>

  <!-- Modal / Overlay de Formulários -->
  <div class="overlay" id="ov">
    <div class="mod" id="mod"></div>
  </div>

  <!-- Scripts -->
  <script src="dados.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
