<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Use Moda Clara</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#EEE9DC;--cream2:#F6F2E8;--ink:#5a3d2f;--brown:#6e4b3a;--sand:#b99a78;--rose2:#b9707a;--rose3:#9a5560;--white:#fffdf8;--grad:linear-gradient(135deg,#e2b0ab,#b9707a 55%,#9a5560)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;padding-bottom:110px}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:700;line-height:1.1}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{width:min(1000px,94vw);margin:auto}
header{background:var(--white);border-bottom:1px solid rgba(185,154,120,.3);position:sticky;top:0;z-index:20}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 0;flex-wrap:wrap}
.top h1{font-size:1.6rem}.top h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:.3rem;overflow:auto;padding-bottom:.7rem}
.tabs button{padding:.55rem 1.1rem;border-radius:99px;border:1px solid rgba(185,154,120,.5);white-space:nowrap;font-size:.9rem}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.2rem;border-radius:99px;font-weight:500;transition:.2s}
.btn.p{background:var(--grad);color:#fff;box-shadow:0 10px 22px -12px var(--rose3)}
.btn.g{border:1.5px solid var(--sand)}
.btn.d{color:#b23b4a;border:1.5px solid #e1b3ba}
.btn.s{padding:.45rem .9rem;font-size:.85rem}
.btn:hover{transform:translateY(-2px)}
.card{background:var(--white);border-radius:20px;padding:1.4rem;margin:1.2rem 0;box-shadow:0 10px 30px -22px rgba(110,75,58,.6)}
.card h2{font-size:1.6rem;margin-bottom:.8rem}
.hint{font-size:.85rem;color:var(--sand);margin-bottom:.8rem}
label{display:grid;gap:.25rem;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--sand)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);padding:.7rem .85rem;border:1.5px solid rgba(185,154,120,.45);background:var(--cream2);border-radius:12px;outline:0;letter-spacing:0;text-transform:none}
input:focus,select:focus,textarea:focus{border-color:var(--rose2);box-shadow:0 0 0 4px rgba(185,112,122,.15)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.stack{display:grid;gap:.8rem}
.plist{display:grid;gap:.7rem}
.pi{display:grid;grid-template-columns:64px 1fr auto;gap:.9rem;align-items:center;background:var(--cream2);border-radius:16px;padding:.6rem}
.pi img{width:64px;height:78px;object-fit:cover;border-radius:10px;background:#ddd}
.pi b{font-family:'Cormorant Garamond';font-size:1.2rem}
.pi small{display:block;color:var(--sand)}
.pill{display:inline-block;font-size:.7rem;padding:.1rem .55rem;border-radius:99px;background:var(--white);margin-right:.3rem;color:var(--rose3)}
.pill.out{background:var(--ink);color:#fff}
.acts{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
.overlay{position:fixed;inset:0;background:rgba(60,35,28,.5);z-index:50;display:none;place-items:center;padding:1rem}
.overlay.on{display:grid}
.mod{background:var(--cream);border-radius:24px;padding:1.5rem;width:min(720px,100%);max-height:94vh;overflow:auto}
.imgs{display:flex;gap:.6rem;flex-wrap:wrap}
.im{position:relative}
.im img{width:84px;height:104px;object-fit:cover;border-radius:10px;display:block}
.im button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#b23b4a;color:#fff;font-size:.9rem;line-height:1}
.im i{position:absolute;left:4px;bottom:4px;background:var(--white);font-style:normal;font-size:.65rem;padding:0 .4rem;border-radius:99px}
.drop{border:2px dashed var(--sand);border-radius:14px;padding:1rem;text-align:center;color:var(--brown);cursor:pointer;margin-bottom:.6rem}
.chk{display:flex;gap:.5rem;align-items:center;text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--ink)}
.chk input{width:auto}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid rgba(185,154,120,.4);padding:.8rem 0;z-index:30;box-shadow:0 -10px 30px -20px rgba(0,0,0,.4)}
.sticky .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.sticky small{color:var(--brown);max-width:520px}
.dirty{color:#b23b4a;font-weight:500}
table{width:100%;border-collapse:collapse}
td,th{padding:.45rem .4rem;text-align:left;font-size:.9rem;vertical-align:middle}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sand)}
.steps{background:#fff7ea;border:1px solid #ecd8b4;border-radius:16px;padding:1rem 1.2rem;font-size:.92rem}
.steps ol{margin:.5rem 0 0 1.2rem}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}.pi{grid-template-columns:52px 1fr}.pi img{width:52px;height:64px}.pi .acts{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1>Painel · <span>Use Moda Clara</span></h1>
    <div class="acts"><button class="btn g s" id="btnHelp">Como publicar?</button></div></div>
  <div class="tabs" id="tabs">
    <button data-t="produtos" class="on">👙 Produtos</button>
    <button data-t="categorias">🗂️ Categorias</button>
    <button data-t="frete">📦 Frete</button>
    <button data-t="loja">🐚 Loja e textos</button>
  </div>
</div></header>

<main class="wrap" id="main"></main>

<div class="sticky"><div class="wrap">
  <small id="stat">Suas alterações ficam salvas neste navegador como rascunho. Para publicar no site, baixe o arquivo e envie para a hospedagem.</small>
  <div class="acts"><button class="btn d s" id="btnReset">Descartar rascunho</button><button class="btn p" id="btnDown">⬇ Baixar dados.js</button></div>
</div></div>

<div class="overlay" id="ov"><div class="mod" id="mod"></div></div>

<script src="dados.js"></script>
<script>
(function(){
'use strict';
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='umc_admin_draft_v1';
let D, dirty=false;
try{ const dr=localStorage.getItem(KEY); if(dr){ D=JSON.parse(dr); dirty=true; } }catch(e){}
if(!D) D=JSON.parse(JSON.stringify(window.LOJA));
D.frete=D.frete||{regioes:{}}; D.textos=D.textos||{}; D.categorias=D.categorias||[]; D.produtos=D.produtos||[];
let tab='produtos', q='';

const persist=()=>{ dirty=true; try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){ alert('Não consegui salvar o rascunho (fotos muito pesadas?). Baixe o arquivo agora para não perder.'); } status(); };
function status(){ $('#stat').innerHTML = dirty? '<span class="dirty">● Alterações não publicadas.</span> Baixe o <b>dados.js</b> e envie para a hospedagem.' : 'Tudo igual ao site publicado.'; }
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('c'+Date.now());
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ph="data:image/svg+xml;utf8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 78'><rect width='64' height='78' fill='#e2b0ab'/><text x='32' y='46' font-family='Georgia' font-size='26' fill='white' text-anchor='middle'>MC</text></svg>");

$('#tabs').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; tab=b.dataset.t; $$('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); render(); };

function render(){
  const m=$('#main');
  if(tab==='produtos') m.innerHTML=vProdutos();
  if(tab==='categorias') m.innerHTML=vCategorias();
  if(tab==='frete') m.innerHTML=vFrete();
  if(tab==='loja') m.innerHTML=vLoja();
  bind(); status();
}

/* ---------- produtos ---------- */
function vProdutos(){
  const list=D.produtos.filter(p=>!q||(p.nome||'').toLowerCase().includes(q.toLowerCase()));
  return `<div class="card"><div class="bar"><h2>Produtos (${D.produtos.length})</h2>
    <div class="acts"><input id="q" placeholder="Buscar peça…" value="${esc(q)}" style="width:180px"><button class="btn p" id="addP">+ Nova peça</button></div></div>
    <div class="plist" style="margin-top:1rem">${list.map(p=>`
      <div class="pi"><img src="${(p.imagens&&p.imagens[0])||ph}" alt="">
        <div><b>${esc(p.nome)}</b><small>${brl(p.preco)} · ${esc((D.categorias.find(c=>c.id===p.categoria)||{}).nome||'Sem categoria')}</small>
          <div style="margin-top:.3rem">${p.destaque?'<span class="pill">Destaque</span>':''}${p.esgotado?'<span class="pill out">Esgotado</span>':''}</div></div>
        <div class="acts"><button class="btn g s" data-a="ed" data-id="${esc(p.id)}">Editar</button>
          <button class="btn g s" data-a="so" data-id="${esc(p.id)}">${p.esgotado?'Voltar ao estoque':'Marcar esgotado'}</button>
          <button class="btn d s" data-a="rm" data-id="${esc(p.id)}">Excluir</button></div></div>`).join('')||'<p class="hint">Nenhuma peça encontrada.</p>'}</div></div>`;
}
function openForm(id){
  const isNew=!id;
  const p=isNew?{id:'p'+Date.now(),categoria:(D.categorias[0]||{}).id||'',nome:'',preco:0,descricao:'',tamanhos:['P','M','G'],cores:[],imagens:[],destaque:false,esgotado:false}:JSON.parse(JSON.stringify(D.produtos.find(x=>x.id===id)));
  const mod=$('#mod');
  const draw=()=>{
    mod.innerHTML=`<h2 style="font-size:1.8rem;margin-bottom:1rem">${isNew?'Nova peça':'Editar peça'}</h2>
    <div class="stack">
      <div class="g2"><label>Nome<input id="f-nome" value="${esc(p.nome)}"></label>
        <label>Categoria<select id="f-cat">${D.categorias.map(c=>`<option value="${esc(c.id)}" ${c.id===p.categoria?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label></div>
      <div class="g2"><label>Preço (R$)<input id="f-preco" inputmode="decimal" value="${String(p.preco).replace('.',',')}"></label>
        <label>Tamanhos (separe por vírgula)<input id="f-tam" value="${esc((p.tamanhos||[]).join(', '))}" placeholder="P, M, G"></label></div>
      <label>Cores (separe por vírgula)<input id="f-cor" value="${esc((p.cores||[]).join(', '))}" placeholder="Rosé, Areia"></label>
      <label>Descrição<textarea id="f-desc" rows="3">${esc(p.descricao)}</textarea></label>
      <div><div class="hint" style="margin-bottom:.4rem">FOTOS — a primeira é a foto principal. As imagens são reduzidas automaticamente.</div>
        <div class="drop" id="drop">📷 Toque para escolher fotos<input type="file" id="f-file" accept="image/*" multiple hidden></div>
        <div class="imgs">${(p.imagens||[]).map((s,i)=>`<div class="im"><img src="${s}" alt=""><button data-x="${i}" title="Remover">×</button>${i===0?'<i>principal</i>':`<i data-main="${i}" style="cursor:pointer">tornar principal</i>`}</div>`).join('')}</div></div>
      <div class="acts" style="justify-content:flex-start;gap:1.4rem"><label class="chk"><input type="checkbox" id="f-dest" ${p.destaque?'checked':''}> Destaque na página inicial</label>
        <label class="chk"><input type="checkbox" id="f-out" ${p.esgotado?'checked':''}> Esgotado</label></div>
      <div class="acts"><button class="btn g" id="f-cancel">Cancelar</button><button class="btn p" id="f-save">Salvar peça</button></div>
    </div>`;
    const grab=()=>{ p.nome=$('#f-nome').value.trim(); p.categoria=$('#f-cat').value; p.preco=parseFloat(String($('#f-preco').value).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'))||0; p.tamanhos=$('#f-tam').value.split(',').map(s=>s.trim()).filter(Boolean); p.cores=$('#f-cor').value.split(',').map(s=>s.trim()).filter(Boolean); p.descricao=$('#f-desc').value.trim(); p.destaque=$('#f-dest').checked; p.esgotado=$('#f-out').checked; };
    $('#drop').onclick=()=>$('#f-file').click();
    $('#f-file').onchange=async e=>{ grab(); for(const f of e.target.files){ try{ p.imagens.push(await compress(f)); }catch(_){} } draw(); };
    $$('.im button',mod).forEach(b=>b.onclick=()=>{ grab(); p.imagens.splice(+b.dataset.x,1); draw(); });
    $$('.im i[data-main]',mod).forEach(b=>b.onclick=()=>{ grab(); const [x]=p.imagens.splice(+b.dataset.main,1); p.imagens.unshift(x); draw(); });
    $('#f-cancel').onclick=closeOv;
    $('#f-save').onclick=()=>{ grab(); if(!p.nome){ alert('Dê um nome para a peça.'); return; } if(!p.categoria){ alert('Crie uma categoria primeiro.'); return; }
      if(isNew) D.produtos.push(p); else D.produtos[D.produtos.findIndex(x=>x.id===p.id)]=p; persist(); closeOv(); render(); };
  };
  draw(); $('#ov').classList.add('on');
}
function compress(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{ const M=900, k=Math.min(1,M/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.8)); }; im.src=r.result; }; r.readAsDataURL(file); }); }
function closeOv(){ $('#ov').classList.remove('on'); }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeOv(); });

/* ---------- categorias ---------- */
function vCategorias(){
  return `<div class="card"><h2>Categorias (abas do site)</h2><p class="hint">Cada categoria vira uma aba no menu da loja.</p>
    <div class="stack">${D.categorias.map((c,i)=>`<div class="pi" style="grid-template-columns:1fr auto"><input data-cn="${i}" value="${esc(c.nome)}">
      <div class="acts"><button class="btn g s" data-a="up" data-i="${i}">↑</button><button class="btn g s" data-a="dn" data-i="${i}">↓</button><button class="btn d s" data-a="rc" data-i="${i}">Excluir</button></div></div>`).join('')}
    <div class="acts" style="justify-content:flex-start"><input id="nc" placeholder="Nova categoria (ex.: Acessórios)" style="max-width:320px"><button class="btn p" id="addC">+ Adicionar</button></div></div></div>`;
}

/* ---------- frete ---------- */
function vFrete(){
  const F=D.frete, reg=F.regioes||{};
  return `<div class="card"><h2>Frete para o Brasil todo</h2>
    <p class="hint">O cliente digita o CEP, o site descobre o estado e aplica o valor da região abaixo. Valor = tarifa da região + adicional por peça extra. São <b>estimativas suas</b> (não consulta os Correios em tempo real).</p>
    <div class="g3"><label>UF de origem (onde você envia)<input id="fr-uf" maxlength="2" value="${esc(F.origemUF||'PB')}" style="text-transform:uppercase"></label>
      <label>Frete grátis acima de (R$) — 0 desliga<input id="fr-g" inputmode="decimal" value="${String(F.gratisAcima||0).replace('.',',')}"></label>
      <label>Adicional por peça extra (R$)<input id="fr-a" inputmode="decimal" value="${String(F.adicionalPorPeca||0).replace('.',',')}"></label></div>
    <table style="margin-top:1rem"><tr><th>Região</th><th>Valor (R$)</th><th>Prazo exibido</th></tr>
    ${Object.keys(reg).map(k=>`<tr><td><b>${esc(k)}</b></td><td><input data-rv="${esc(k)}" inputmode="decimal" value="${String(reg[k].valor).replace('.',',')}" style="max-width:110px"></td><td><input data-rp="${esc(k)}" value="${esc(reg[k].prazo)}"></td></tr>`).join('')}</table>
    <p class="hint" style="margin-top:.8rem">Dica: "Local" vale para o estado de origem; as demais regiões seguem o mapa do Brasil.</p></div>`;
}
const num=v=>parseFloat(String(v).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'))||0;

/* ---------- loja ---------- */
function vLoja(){
  const T=D.textos;
  const f=(id,l,v,ta)=>`<label>${l}${ta?`<textarea id="${id}" rows="3">${esc(v)}</textarea>`:`<input id="${id}" value="${esc(v)}">`}</label>`;
  return `<div class="card"><h2>Dados da loja</h2><div class="stack">
    <div class="g2">${f('l-nome','Nome da loja',D.nome)}${f('l-slogan','Slogan',D.slogan)}</div>
    <div class="g2">${f('l-wa','WhatsApp que recebe os pedidos (com 55 + DDD)',D.whatsapp)}${f('l-ig','Instagram (sem @)',D.instagram)}</div>
    <p class="hint">Exemplo de WhatsApp: 5583999998888 — somente números.</p></div></div>
  <div class="card"><h2>Textos do site</h2><div class="stack">
    ${f('t-ht','Título da capa',T.heroTitulo)}${f('t-hx','Texto da capa',T.heroTexto,1)}
    ${f('t-st','Título "Sobre"',T.sobreTitulo)}${f('t-sx','Texto "Sobre a loja"',T.sobreTexto,1)}
    <div class="g2">${f('t-hr','Horário de atendimento',T.horario)}${f('t-en','Endereço / atendimento',T.endereco)}</div></div></div>`;
}

/* ---------- binds ---------- */
function bind(){
  const m=$('#main');
  if(tab==='produtos'){
    $('#addP').onclick=()=>{ if(!D.categorias.length){ alert('Crie uma categoria primeiro (aba Categorias).'); return; } openForm(); };
    $('#q').oninput=e=>{ q=e.target.value; const pos=e.target.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); };
    $$('[data-a]',m).forEach(b=>b.onclick=()=>{
      const id=b.dataset.id, p=D.produtos.find(x=>x.id===id);
      if(b.dataset.a==='ed') openForm(id);
      if(b.dataset.a==='so'){ p.esgotado=!p.esgotado; persist(); render(); }
      if(b.dataset.a==='rm' && confirm('Excluir "'+p.nome+'"?')){ D.produtos=D.produtos.filter(x=>x.id!==id); persist(); render(); }
    });
  }
  if(tab==='categorias'){
    $$('[data-cn]',m).forEach(i=>i.onchange=()=>{ const v=i.value.trim(); if(v){ D.categorias[+i.dataset.cn].nome=v; persist(); } });
    $('#addC').onclick=()=>{ const v=$('#nc').value.trim(); if(!v) return; let id=slug(v); while(D.categorias.some(c=>c.id===id)) id+='-2'; D.categorias.push({id,nome:v}); persist(); render(); };
    $$('[data-a]',m).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i, a=b.dataset.a;
      if(a==='up'&&i>0){ [D.categorias[i-1],D.categorias[i]]=[D.categorias[i],D.categorias[i-1]]; }
      if(a==='dn'&&i<D.categorias.length-1){ [D.categorias[i+1],D.categorias[i]]=[D.categorias[i],D.categorias[i+1]]; }
      if(a==='rc'){ const c=D.categorias[i], n=D.produtos.filter(p=>p.categoria===c.id).length;
        if(n){ alert('Essa categoria ainda tem '+n+' peça(s). Mova ou exclua as peças antes.'); return; }
        if(!confirm('Excluir a categoria "'+c.nome+'"?')) return; D.categorias.splice(i,1); }
      persist(); render();
    });
  }
  if(tab==='frete'){
    const F=D.frete;
    $('#fr-uf').onchange=e=>{ const uf=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,2)||'PB'; const old='Local ('+(F.origemUF||'PB')+')';
      const n={}; for(const k of Object.keys(F.regioes)){ n[k===old?'Local ('+uf+')':k]=F.regioes[k]; } F.regioes=n; F.origemUF=uf; persist(); render(); };
    $('#fr-g').onchange=e=>{ F.gratisAcima=num(e.target.value); persist(); };
    $('#fr-a').onchange=e=>{ F.adicionalPorPeca=num(e.target.value); persist(); };
    $$('[data-rv]',m).forEach(i=>i.onchange=()=>{ F.regioes[i.dataset.rv].valor=num(i.value); persist(); });
    $$('[data-rp]',m).forEach(i=>i.onchange=()=>{ F.regioes[i.dataset.rp].prazo=i.value; persist(); });
  }
  if(tab==='loja'){
    const map={ 'l-nome':v=>D.nome=v,'l-slogan':v=>D.slogan=v,'l-wa':v=>D.whatsapp=v.replace(/\D/g,''),'l-ig':v=>D.instagram=v.replace('@','').trim(),
      't-ht':v=>D.textos.heroTitulo=v,'t-hx':v=>D.textos.heroTexto=v,'t-st':v=>D.textos.sobreTitulo=v,'t-sx':v=>D.textos.sobreTexto=v,'t-hr':v=>D.textos.horario=v,'t-en':v=>D.textos.endereco=v };
    for(const id in map){ const el=$('#'+id); el.onchange=()=>{ map[id](el.value); persist(); }; }
  }
}

/* ---------- exportar ---------- */
$('#btnDown').onclick=()=>{
  const out='/* USE MODA CLARA — dados da loja. Gerado pelo painel em '+new Date().toLocaleString('pt-BR')+' */\nwindow.LOJA = '+JSON.stringify(D,null,2)+';\n';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'text/javascript'})); a.download='dados.js'; document.body.appendChild(a); a.click(); a.remove();
  dirty=false; try{localStorage.removeItem(KEY);}catch(e){} status();
  alert('Pronto! Agora substitua o dados.js antigo pelo novo na hospedagem do site.');
};
$('#btnReset').onclick=()=>{ if(!confirm('Descartar alterações e voltar ao que está no dados.js atual?')) return; try{localStorage.removeItem(KEY);}catch(e){} D=JSON.parse(JSON.stringify(window.LOJA)); dirty=false; render(); };
$('#btnHelp').onclick=()=>{
  $('#mod').innerHTML=`<h2 style="font-size:1.8rem;margin-bottom:.8rem">Como publicar suas alterações</h2>
  <div class="steps"><ol>
    <li>Edite peças, preços, frete e textos neste painel.</li>
    <li>Clique em <b>Baixar dados.js</b>.</li>
    <li>Na hospedagem do site, substitua o arquivo <b>dados.js</b> pelo novo.</li>
    <li>Pronto: o site já mostra as mudanças (atualize a página).</li></ol></div>
  <p class="hint" style="margin-top:1rem">Guarde o <b>admin.html</b> só no seu computador/celular — não precisa subir ele para a hospedagem. Sem o <b>dados.js</b> junto na mesma pasta, o painel abre vazio.</p>
  <div class="acts" style="margin-top:1rem"><button class="btn p" id="okh">Entendi</button></div>`;
  $('#ov').classList.add('on'); $('#okh').onclick=closeOv;
};
render();
})();
</script>
