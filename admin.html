<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel — Use Moda Clara</title>
  <meta name="robots" content="noindex,nofollow">

  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Estilos do Painel -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Cabeçalho e Abas de Navegação -->
  <header>
    <div class="wrap">
      <div class="top">
        <h1>Painel · <span>Use Moda Clara</span></h1>
        <div class="acts">
          <button class="btn g s" id="btnHelp">Ajuda</button>
        </div>
      </div>
      <div class="tabs" id="tabs">
        <button data-t="produtos" class="on">👙 Produtos</button>
        <button data-t="categorias">🗂️ Categorias</button>
        <button data-t="frete">📦 Frete</button>
        <button data-t="loja">🐚 Loja e textos</button>
      </div>
    </div>
  </header>

  <!-- Área Principal de Conteúdo -->
  <main class="wrap" id="main"></main>

  <!-- Barra Fixa Inferior com Status e Ações -->
  <div class="sticky">
    <div class="wrap">
      <small id="stat">Carregando…</small>
      <div class="acts">
        <button class="btn g s" id="btnBackup" title="Baixa uma cópia dos dados no seu computador">⬇ Backup</button>
        <button class="btn success" id="btnSaveCloud">🚀 Salvar no Site</button>
      </div>
    </div>
  </div>

  <!-- Modal / Overlay de Edição de Produtos -->
  <div class="overlay" id="ov">
    <div class="mod" id="mod"></div>
  </div>

  <!-- Modal de Proteção por Senha -->
  <div class="overlay" id="authOverlay">
    <div class="auth-box">
      <h2>Painel da Loja</h2>
      <p>Digite a senha para acessar o gerenciador:</p>
      <input type="password" id="authPass" placeholder="Senha de acesso" autocomplete="current-password">
      <p class="err" id="authErr">Senha incorreta. Tente novamente.</p>
      <button class="btn p" id="authBtn" style="width:100%">Entrar no Painel</button>
    </div>
  </div>

  <!-- Bibliotecas e Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="dados.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
