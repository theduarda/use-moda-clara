<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Use Moda Clara — Moda Praia</title>
  <meta name="description" content="Biquínis, maiôs, vestidos e saídas de praia. Enviamos para todo o Brasil.">
  <link rel="icon" href="logo.png">
  <meta name="theme-color" content="#EEE9DC">

  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Estilos da Loja -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Cabeçalho Principal -->
  <header id="hdr">
    <div class="wrap bar">
      <a class="logo" href="#/inicio" aria-label="Início">
        <span id="logoMark"></span>
        <span class="logo-name">Use Moda Clara<small>MODA PRAIA</small></span>
      </a>
      <nav id="nav"></nav>
      <div class="actions">
        <button class="cart-btn" id="cartBtn" aria-label="Abrir carrinho">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/>
            <path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>
          </svg>
          <span class="badge" id="badge">0</span>
        </button>
        <button class="burger" id="burger" aria-label="Menu"><span></span></button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Renderizado Dinamicamente -->
  <main id="app"></main>

  <!-- Rodapé -->
  <footer>
    <div class="wrap">© <span id="yr"></span> Use Moda Clara · Moda praia · Enviamos para todo o Brasil</div>
  </footer>

  <!-- Botão Flutuante WhatsApp -->
  <a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
    <svg viewBox="0 0 32 32">
      <path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 2.4a10.6 10.6 0 1 1-5.4 19.7l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 0 1 16 5.4zm-4 5.2c-.3 0-.7.1-1 .5-.4.4-1.3 1.3-1.3 3.1s1.3 3.6 1.5 3.9c.2.2 2.6 4.1 6.4 5.6 3.2 1.2 3.8 1 4.5.9.7-.1 2.2-.9 2.5-1.8.3-.9.3-1.6.2-1.8-.1-.2-.4-.3-.8-.5s-2.2-1.1-2.5-1.2c-.4-.1-.6-.2-.9.2-.2.4-1 1.2-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8l.6-.7c.2-.2.2-.4.4-.6.1-.3.1-.5 0-.7l-1.2-2.9c-.3-.7-.6-.6-.9-.6z"/>
    </svg>
  </a>

  <!-- Modais, Gaveta e Notificações -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Carrinho"></aside>
  <div class="modal" id="modal"></div>
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="dados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
